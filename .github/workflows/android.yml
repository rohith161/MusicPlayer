name: Android Build + Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'

# Keep only the newest run for a branch/PR so rapid commits do not consume
# unnecessary runner time.
concurrency:
  group: musicplayer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Unit Tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # PRs still compile and test, but only main/manual runs store an APK.
      # This keeps artifact storage small while retaining a downloadable build.
      - name: Upload debug APK
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload lint report
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
